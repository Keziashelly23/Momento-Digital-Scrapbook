<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momento</title>
  <link rel="icon" type="image/x-icon" href="images/logo.png">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <header>
    <p id="userGreeting">Loading...</p>
    <button id="signOutBtn" onclick="signOut()">Sign Out</button>
  </header>

  <h1>📓 My Journals</h1>
  <div id="dashboard" class="dashboard"></div>

  <button onclick="createNewJournal()" class="create-btn">+ Create New Journal</button>

  <!-- Create Journal Modal -->
  <div id="createJournalModal" class="modal">
    <div class="modal-content">
      <h2>Create a New Journal</h2>
      <label>
        Journal Title:
        <input type="text" id="journalTitle" placeholder="Enter journal title" />
      </label>
      <br>
      <label>
        Choose Cover Color:
        <input type="color" id="journalColor" value="#E6BDDC" />
      </label>
      <br><br>
      <div class="modal-buttons">
        <button id="createJournalConfirm">Create</button>
        <button id="createJournalCancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Edit Journal Modal -->
  <div id="editJournalModal" class="modal">
    <div class="modal-content">
      <h2>Edit Journal</h2>
      <label>
        Journal Title:
        <input type="text" id="editJournalTitle" placeholder="Enter journal title" />
      </label>
      <br>
      <label>
        Choose Cover Color:
        <input type="color" id="editJournalColor" value="#E6BDDC" />
      </label>
      <br><br>
      <div class="modal-buttons">
        <button id="editJournalSave">Save</button>
        <button id="editJournalCancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBMK3YVY8G159USlVmOT6oEZOzAhkQ27f8",
      authDomain: "scrapbookapp-18607.firebaseapp.com",
      projectId: "scrapbookapp-18607",
};
    firebase.initializeApp(firebaseConfig);
    window.auth = firebase.auth();
    window.db = firebase.firestore();
  </script>

  <script src="dashboard.js"></script>
</body>
</html>
