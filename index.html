<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Scrapbook</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>  
  <div id="left-side">
    <section id="left-content">
      <main class="login">
        <section class="login-section">
          <h2 style="font-family: momo; font-size: 70px; color: #e13f88; text-align: center; margin-top: 30px;margin-bottom: 0px;">
            M<span style="font-style: italic; margin-right: 6px;">♡</span>ment<span style="font-style: italic;">♡</span>
          </h2>
          <img src="images/logo.png" style="width: 125px; display: block; margin: auto;">
          <p style="font-family: nanum; font-size: 25px; text-align: center; color: #717171;">
            Collect, customize, and celebrate your story!
          </p>
          <div id="authControls">
            <button id="googleSignIn">Sign in with Google</button>
            <p id="userStatus">Not signed in</p>
          </div>
        </section>
      </main>
    </section>
  </div>

    <div id="right-side">
        <img id="journal-right" src="images/journal-ex.png">

        <div class="sticker" style="top: 45%; left: 0%; width: 140px; height: 100px;">
            <img src="images/sticker-4.png" alt="sticker">
        </div>

        <div class="sticker" style="top: 45%; left: 82%;">
            <img src="images/sticker-3.png" alt="sticker">
        </div>
        
        <div class="sticker" style="top: 15%; left: 4%; width: 90px; height: 90px;">
            <img src="images/sticker-1.png" alt="sticker">
        </div>

        <div class="sticker" style="top: 72%; left: 85%; width: 70px; height: 70px;">
            <img src="images/sticker-1.png" alt="sticker">
        </div>

        <div class="sticker" style="top: 70%; left: 4%;">
            <img src="images/logo.png" alt="sticker">
        </div>

        <div class="sticker" style="top: 15%; left: 82%;">
            <img src="images/sticker-2.png" alt="sticker">
        </div>



        
    </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
